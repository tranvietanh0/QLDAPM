spring.application.name=intern-management
server.port=${SERVER_PORT:8081}
server.address=0.0.0.0
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/intern_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
app.session.hours=${SESSION_HOURS:12}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}