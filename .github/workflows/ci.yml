name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify + JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml

      - name: Build and test
        run: mvn -B verify

      - name: Write coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then
            echo "JaCoCo report not found at app/backend/$csv" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Columns: 6/7 = BRANCH_MISSED/COVERED, 8/9 = LINE_MISSED/COVERED
          awk -F, 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
            END {
              lt = lm + lc; bt = bm + bc
              printf "## Backend test coverage (JaCoCo)\n\n"
              printf "| Metric | Covered | Total | %% |\n|---|---|---|---|\n"
              printf "| Lines | %d | %d | %.2f%% |\n", lc, lt, (lt ? 100 * lc / lt : 0)
              printf "| Branches | %d | %d | %.2f%% |\n", bc, bt, (bt ? 100 * bc / bt : 0)
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: app/backend/target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: Frontend (npm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - run: npm ci

      - run: npm run build
